name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch (or PR) supersedes this run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux' # formatting is platform-independent
        run: cargo fmt --all --check

      - name: Clippy (all features, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (each feature alone, warnings denied)
        if: runner.os == 'Linux' # feature gating is platform-independent
        run: |
          cargo clippy --all-targets -- -D warnings
          for feature in fpga pcb kicad dsn mapf asic; do
            cargo clippy --all-targets --features "$feature" -- -D warnings
          done

      - name: Test (all features)
        run: cargo test --all-features

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keep in step with `rust-version` in Cargo.toml.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --all-targets --all-features

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build docs (warnings denied)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
