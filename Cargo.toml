[package]
name = "guide"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
description = "Placement and routing engine for PCBs, FPGAs and other constrained connection problems (early scaffold: no routing yet)."
repository = "https://github.com/KarpelesLab/guide"
license = "MIT"
readme = "README.md"
keywords = ["routing", "placement", "pcb", "fpga", "eda"]
categories = ["algorithms", "science"]
# The sample files are only used by tests, and some have licences of their own.
exclude = [".github", "testdata"]

[package.metadata.docs.rs]
all-features = true

[features]
# FPGA routing problems: importing device graphs and designs from VTR.
fpga = []
# PCB-like domains: shapes, exact clearances, a spatial index, design rules, a DRC, and
# PCB routing.
pcb = ["dep:polyclip"]
# Reading KiCad boards and their rules into the geometry layer, for clearance checks and
# routing.
kicad = ["pcb"]
# Reading Specctra DSN designs into the geometry layer, and writing SES sessions.
dsn = ["pcb"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
# Exact integer polygon geometry. Kept out of the public API: see src/geom/poly.rs.
polyclip = { version = "0.0.6", optional = true }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "search"
harness = false

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "place"
harness = false

[[bench]]
name = "geom"
harness = false
required-features = ["pcb"]

[[example]]
name = "vtr_route"
required-features = ["fpga"]

[[example]]
name = "vtr_place"
required-features = ["fpga"]

[[example]]
name = "vtr_eco"
required-features = ["fpga"]
