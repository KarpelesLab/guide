[package]
name = "guide"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Placement and routing engine for PCBs, FPGAs and other constrained connection problems (early scaffold: no routing yet)."
repository = "https://github.com/KarpelesLab/guide"
license = "MIT"
readme = "README.md"
keywords = ["routing", "placement", "pcb", "fpga", "eda"]
categories = ["algorithms", "science"]
# The sample files are only used by tests, and some have licences of their own.
exclude = [".github", "testdata"]

[package.metadata.docs.rs]
all-features = true

[features]
# FPGA routing problems: importing device graphs and designs from VTR.
fpga = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "search"
harness = false
