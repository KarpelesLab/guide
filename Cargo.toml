[package]
name = "guide"
version = "0.0.2"
edition = "2024"
rust-version = "1.95"
description = "Placement and routing engine for PCBs, FPGAs, ASIC global routing, multi-agent path finding and other constrained connection problems."
repository = "https://github.com/KarpelesLab/guide"
license = "MIT"
readme = "README.md"
keywords = ["routing", "placement", "pcb", "fpga", "eda"]
categories = ["algorithms", "science"]
# The sample files are only used by tests, and some have licences of their own.
exclude = [".github", "testdata", "scripts"]

[package.metadata.docs.rs]
all-features = true
# Marks each feature-gated item with the feature it needs (`doc_cfg`, nightly only).
rustdoc-args = ["--cfg", "docsrs"]

[features]
# FPGA routing problems: importing device graphs and designs from VTR.
fpga = []
# PCB-like domains: shapes, exact clearances, a spatial index, design rules, a DRC, and
# PCB routing.
pcb = ["dep:polyclip"]
# Reading KiCad boards and their rules into the geometry layer, for clearance checks and
# routing.
kicad = ["pcb"]
# Reading Specctra DSN designs into the geometry layer, and writing SES sessions.
dsn = ["pcb"]
# Multi-agent path finding over time-expanded grids and graphs, and reading the MovingAI
# benchmarks for it.
mapf = []
# ASIC global routing: the ISPD 2007 and 2008 contests' designs, routes and scoring.
asic = []
# The `guide` command-line tool, with every domain: `cargo install guide --features cli`.
# Library users don't need it.
cli = ["fpga", "kicad", "dsn", "mapf", "asic"]

[lints.rust]
unsafe_code = "forbid"
# Every public item is documented; docs/api-review.md explains the lints chosen.
missing_docs = "deny"

# A few of clippy's pedantic lints, those about the public API's documentation and
# use: the rest of the group is too noisy to be worth turning on whole.
[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
return_self_not_must_use = "warn"

[dependencies]
# Exact integer polygon geometry. Kept out of the public API: see src/geom/poly.rs.
polyclip = { version = "0.0.6", optional = true }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bin]]
name = "guide"
path = "src/bin/guide/main.rs"
required-features = ["cli"]

[[bench]]
name = "search"
harness = false

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "place"
harness = false

[[bench]]
name = "geom"
harness = false
required-features = ["pcb"]

[[example]]
name = "vtr_route"
required-features = ["fpga"]

[[example]]
name = "vtr_place"
required-features = ["fpga"]

[[example]]
name = "vtr_eco"
required-features = ["fpga"]

[[example]]
name = "vtr_loop"
required-features = ["fpga"]

[[example]]
name = "mapf_bench"
required-features = ["mapf"]

[[example]]
name = "ispd_route"
required-features = ["asic"]

# Routing and placement tests run whole boards and circuits, and take minutes unoptimised.
[profile.test]
opt-level = 1
